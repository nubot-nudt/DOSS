# Config format schema number
format_version: 4

###################
## Model options
model_params:
  model_architecture: "cylinder_asym"

  output_shape:
    - 480
    - 360
    - 32

  fea_dim: 9
  out_fea_dim: 256
  num_class: 18  # the number of known classes
  num_input_features: 16
  use_norm: True
  init_size: 32


###################
## Dataset options
dataset_params:
  dataset_type: "cylinder_dataset_panop"
  pc_dataset_type: "SemKITTI_sk_panop"
  ignore_label: 0
  return_test: False
  fixed_volume_space: True
  label_mapping: "../config/label_mapping/semantic-kitti.yaml"
  max_volume_space:
    - 50
    - 3.1415926
    - 2
  min_volume_space:
    - 0
    - -3.1415926
    - -4


###################
## Data_loader options
train_data_loader:
  data_path: "/path/to/kitti/dataset/sequences/"
  imageset: "train"
  return_ref: True
  batch_size: 2
  shuffle: True
  num_workers: 4

val_data_loader:
  data_path: "/path/to/kitti/dataset/sequences/"
  imageset: "val"
  return_ref: True
  batch_size: 1
  shuffle: False
  num_workers: 4


###################
## Train params
train_params:
  model_load_path: "/path/to/load/pre-trained_model.pt"  # path of pre-trained model
  model_save_path: "/path/to/save/best_model.pt"  # path to save the best training checkpoint
  model_latest_path: "/path/to/save/latest_model.pt"  # path to save the latest training checkpoint
  checkpoint_every_n_steps: 9565
  max_num_epochs: 40
  eval_every_n_steps: 9565
  learning_rate: 0.001
